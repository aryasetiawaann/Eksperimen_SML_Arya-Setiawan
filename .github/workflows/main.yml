name: Preprocessing Dataset

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.12.10"

    - name: Install dependencies
      run: pip install mlflow==2.19.0 seaborn

    - name: Run preprocessing
      run: |
        python preprocessing/automate_Arya-Setiawan.py

    - name: Upload preprocessing data
      uses: actions/upload-artifact@v4
      with:
        name: heart-failure-preprocessing
        path: preprocessing/heart_failure_preprocessing/
